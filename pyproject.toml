[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_legal_qa"]

[project]
name = "vietnamese-traffic-law-rag"
version = "0.1.0"
description = "Traceable Vietnamese road-traffic law ingestion and structural graph foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=6.2,<7",
  "pydantic>=2.11,<3",
  "pyvi>=0.1.1,<1",
  "sentence-transformers>=5.1,<6",
  "typer>=0.15,<1",
]

[project.scripts]
traffic-legal-qa = "traffic_legal_qa.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
